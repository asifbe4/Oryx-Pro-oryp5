###########################################
# Picom.conf - Lightweight Blur + Corners #
###########################################

# Backend (xrender is fastest, glx is smoother — try both)
backend = "xrender";
vsync = true;

# Transparency
inactive-opacity = 0.95;
active-opacity   = 1.0;

# Optional: dim instead of just making transparent
inactive-dim = 0.1;        # 0.0 = no dim, 1.0 = fully black

# Rounded corners (small for light performance hit)
corner-radius = 2;
round-borders = 1;

# Exclude certain apps from opacity/dimming
opacity-rule = [
  "100:class_g = 'Polybar'",         # Polybar fully visible
  "100:class_g = 'Dunst'",           # Notifications
  "94:class_g = 'Xfce4-appfinder'",
  "100:class_g = 'feh'"              # Image viewer
];

# Blur (lightweight settings)
blur-method = "dual_kawase";
blur-strength = 3;                   # low = fast
blur-background = true;
blur-background-frame = false;       # don’t blur titlebars

# Shadows (very light)
shadow = true;
shadow-radius = 8;
shadow-offset-x = -6;
shadow-offset-y = -6;
shadow-opacity  = 0.35;

# Fading (fast + light)
fading = true;
fade-in-step  = 0.05;
fade-out-step = 0.05;
fade-delta    = 5;

# Window types
wintypes:
{
  tooltip       = { fade = true; shadow = false; opacity = 0.9; };
  dock          = { shadow = false; corner-radius = 0; opacity = 1.0; };  # Polybar / dock flat
  panel         = { shadow = false; corner-radius = 0; opacity = 1.0; };  # for panels recognized as "panel"
  dnd           = { shadow = false; };
  popup_menu    = { opacity = 0.95; blur-background = true; };
  dropdown_menu = { opacity = 0.95; blur-background = true; };
};
