###########################################
# Picom.conf - Lightweight Blur + Corners #
###########################################

# Backend (xrender is fastest, glx is smoother — try both)
backend = "glx";
vsync = true;

# Transparency
inactive-opacity = 0.95;
active-opacity   = 1.0;

# Rounded corners (keep small for light performance hit)
corner-radius = 6;
round-borders = 1;

# Blur (lightweight settings)
blur-method = "dual_kawase";
blur-strength = 3;        # lower = faster
blur-background = true;
blur-background-frame = false;  # don’t blur titlebars (saves resources)

# Shadows (very light)
shadow = true;
shadow-radius = 8;
shadow-offset-x = -6;
shadow-offset-y = -6;
shadow-opacity  = 0.35;

# Fading (fast + light)
fading = true;
fade-in-step  = 0.05;
fade-out-step = 0.05;
fade-delta    = 5;

# Window types
wintypes:
{
  tooltip       = { fade = true; shadow = false; opacity = 0.9; };
  dock          = { shadow = false; };
  dnd           = { shadow = false; };
  popup_menu    = { opacity = 0.95; blur-background = true; };
  dropdown_menu = { opacity = 0.95; blur-background = true; };
};

