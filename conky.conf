conky.config = {

	background = true, 
	cpu_avg_samples = 2,
	diskio_avg_samples = 10,
	double_buffer = true,
	if_up_strictness = 'address',
	no_buffers = true,
	temperature_unit = 'celsius',
	text_buffer_size = 256,
	update_interval = 1,
	imlib_cache_size = 0,

	alignment = 'middle_right',
	gap_x = 20,
	gap_y = 0,
	minimum_height = 175,
	minimum_width = 229,
	maximum_width = 200,

	border_inner_margin = 3,
	border_outer_margin = 3,
	border_width = 0,
	default_bar_width = 0,
	default_bar_height = 6,
	default_gauge_height = 25,
	default_gauge_width =40,
	default_graph_height = 40,
	default_graph_width = 0,
	default_shade_color = '#000000',
	default_outline_color = '#000000',
	draw_borders = false,
	draw_graph_borders = false,
	draw_shades = true,
	draw_outline = false,
	stippled_borders = 0,

	extra_newline = false,
	format_human_readable = true,
	font = 'JetBrainsMono Nerd Font:size=10:',
	max_text_width = 0,	
	max_user_text = 16384,
	override_utf8_locale = true,
	short_units = true,
	top_name_width = 21,
	top_name_verbose = false,
	uppercase = false,
	use_spacer = 'none',
	use_xft = true,
	xftalpha = 1,

	own_window = true,
	own_window_argb_value = 153,
	own_window_argb_visual = true,
	own_window_class = 'Conky',
	own_window_colour = '#FF263238',
	own_window_hints = 'undecorated,below,above,sticky,skip_taskbar,skip_pager',
	own_window_transparent = false,
	own_window_title = 'system_conky',
	own_window_type = 'override',

	default_color = '#ff0000',
	color1 = '#FFFFFF',
	color2 = '#FFA726',
	color3 = '#6EC0E7',
	color4 = '#BDBDBD',
	color5 = '#CCCCCC',
	color6 = '#aa0000',
	color7 = '#1F7411',
	color8 = '#FFA726',
	color9 = '#F1544B',

}

conky.text = [[
${font JetBrainsMono Nerd Font:bold:size=10}${color1}${alignc}ASIFBE4LIVE-STUDIOS
${font JetBrainsMono Nerd Font:size=9}${color0}Host:${alignr}${nodename}
Ver:${alignr}${kernel}
Uptime:${alignr}${uptime}
${color2}Battery:${alignr}${battery_percent BAT0}%
${color0}Fan:${alignr}${hwmon 0 fan 1} RPM
${font JetBrainsMono Nerd Font:bold:size=9}${color2}CPU ${hr 1}
${color0}Usage:${alignr}${cpu}%
${color0}Clock:${alignr}${freq_g} GHz
${color0}Temp:${alignr}${execi 5 sensors | grep 'Core 0:' | awk '{print $3}'}
${cpubar 6,200}
${font JetBrainsMono Nerd Font:bold:size=9}${color2}GPU ${hr 1}
${font JetBrainsMono Nerd Font:size=9}${color0}Model:${alignr}${execi 60 nvidia-smi --query-gpu=name --format=csv,noheader}
${color0}Usage:${alignr}${execi 2 sh -c "nvidia-smi --query-gpu=utilization.gpu --format=csv,noheader,nounits 2>/dev/null || echo 0"}%
${color0}Clock:${alignr}${execi 2 sh -c "nvidia-smi --query-gpu=clocks.gr --format=csv,noheader,nounits 2>/dev/null || echo 0"} MHz
${color0}Power:${alignr}${execi 2 sh -c "nvidia-smi --query-gpu=power.draw --format=csv,noheader,nounits 2>/dev/null || echo 0"} W
${execibar 6,200 sh -c "nvidia-smi --query-gpu=power.draw --format=csv,noheader,nounits 2>/dev/null | awk '{printf \"%d\", ($1/80)*100}' || echo 0"}
${font JetBrainsMono Nerd Font:bold:size=10}${color3}MEMORY ${hr 1}
${font JetBrainsMono Nerd Font:size=9}${color0}RAM:${alignr}$mem / $memmax
${membar 6,200}
${color0}Swap:${alignr}$swap / $swapmax
${swapbar 6,200}
${font JetBrainsMono Nerd Font:bold:size=10}${color2}DISK ${hr 1}
${color0}/home:${alignr}${fs_used /home} / ${fs_size /home}
${fs_bar 6,200 /home}
${font JetBrainsMono Nerd Font:bold:size=10}${color3}NETWORK ${hr 1}
${font JetBrainsMono Nerd Font:size=9}${color0}Interface:${alignr}${gw_iface}${if_existing /sys/class/net/${gw_iface}/wireless}
${color0}Signal:${alignr}${wireless_link_qual_perc ${gw_iface}}%${endif}
${color0}Download:${color2}${alignr}${downspeedf ${gw_iface}} KiB/s
${color0}Upload:${color3}${alignr}${upspeedf ${gw_iface}} KiB/s
${font JetBrainsMono Nerd Font:size=9}${color2}CPU: ${hr 1}
${top name 1}${alignr}${top cpu 1}%
${top name 2}${alignr}${top cpu 2}%
${top name 3}${alignr}${top cpu 3}%
${color0}RAM: ${hr 1}
${top_mem name 1}${alignr}${top_mem mem 1}%
${top_mem name 2}${alignr}${top_mem mem 2}%
${top_mem name 3}${alignr}${top_mem mem 3}%
]]
